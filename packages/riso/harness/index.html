<!doctype html>
<meta charset="utf-8" />
<title>riso harness</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    gap: 12px;
    background: #2a2a2a;
    color: #cfcabf;
    font:
      13px/1.5 ui-monospace,
      SFMono-Regular,
      Menlo,
      monospace;
  }
  main {
    display: grid;
    gap: 10px;
    justify-items: center;
    padding: 24px;
  }
  canvas {
    display: block;
    box-shadow: 0 10px 40px rgb(0 0 0 / 0.5);
  }
  nav {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button,
  input {
    font: inherit;
  }
  #label {
    opacity: 0.75;
    min-height: 1.5em;
    text-align: center;
  }
</style>
<main>
  <canvas id="c"></canvas>
  <nav>
    <button id="playpause">play</button>
    <input
      id="scrub"
      type="range"
      min="0"
      max="1"
      step="0.001"
      value="0"
      style="width: 360px"
    />
    <output id="clock">0.00</output>
  </nav>
  <div id="label"></div>
</main>
<script type="module" src="./main.ts"></script>
